[package]
name = "dfmount"
version = "0.1.0"
edition = "2021"
authors = ["tylerstyle <tylerstyle@users.noreply.github.com>"]
description = "Modern forensic storage mounter, write-blocker and target unblocker TUI/CLI tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerstyle/dfmount"
homepage = "https://github.com/tylerstyle/dfmount"
readme = "README.md"
keywords = ["forensics", "dfir", "write-blocker", "mount", "tui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
